version: '3.8'

services:
  # ══════════════════════════════════════════════════════════
  # CONSUL - Service Discovery con Registro Manual
  # ══════════════════════════════════════════════════════════
  consul:
    image: hashicorp/consul:1.18
    container_name: consul-server
    # Se agrega -config-dir para que Consul lea los JSON de la carpeta
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0 -config-dir=/consul/config
    volumes:
      - ./consul-config:/consul/config # Conecta tu carpeta local con el contenedor
    ports:
      - "8500:8500"
    networks:
      - mi-red-municipal
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ... (Resto de tus servicios: postgres-auth-db, auth-api, etc.) ...

  municipality-api:
    build: ./municipality-api
    container_name: municipality-api
    ports:
      - "8081:8080"
    depends_on:
      postgres-municipality:
        condition: service_healthy
      consul:
        condition: service_healthy
    # No olvides agregar esta dependencia para que el Health Check funcione
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-municipality:5432/municipality_db
      - QUARKUS_DATASOURCE_USERNAME=municipality_user
      - QUARKUS_DATASOURCE_PASSWORD=municipality_password
      - QUARKUS_STORK_AUTH_SERVICE_SERVICE_DISCOVERY_TYPE=consul
      - QUARKUS_STORK_AUTH_SERVICE_SERVICE_DISCOVERY_CONSUL_HOST=consul
      - QUARKUS_STORK_AUTH_SERVICE_SERVICE_DISCOVERY_CONSUL_PORT=8500
    networks:
      - mi-red-municipal

# ... resto del archivo ...