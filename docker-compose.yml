services:
  postgres-municipality:
    image: postgres:15-alpine
    container_name: postgres-municipality
    environment:
      POSTGRES_DB: municipality_db
      POSTGRES_USER: municipality_user
      POSTGRES_PASSWORD: municipality_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - municipality-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U municipality_user -d municipality_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  municipality-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: municipality-api
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-municipality:5432/municipality_db
      QUARKUS_DATASOURCE_USERNAME: municipality_user
      QUARKUS_DATASOURCE_PASSWORD: municipality_password
    depends_on:
      postgres-municipality:
        condition: service_healthy
    networks:
      - municipality-net

  municipality-frontend:
    build:
      context: ./municipality-frontend
      dockerfile: Dockerfile
    container_name: municipality-frontend
    ports:
      - "4200:80"
    depends_on:
      - municipality-api
    networks:
      - municipality-net

networks:
  municipality-net:
    driver: bridge

volumes:
  postgres_data:
